<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fliperama Fichas Online</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0d0d12; color: #fff; margin: 0; padding: 12px; text-align: center; }
    .header { background: linear-gradient(135deg, #1e1e2f, #2a1b3d); border: 2px solid #f39c12; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .header h1 { margin: 0 0 8px; font-size: 20px; color: #f1c40f; letter-spacing: 1px; }
    .saldo-box { background: #000; display: inline-block; padding: 8px 20px; border-radius: 20px; border: 1px solid #2ecc71; font-size: 18px; font-weight: bold; color: #2ecc71; }
    
    .card { background: #181824; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #2c2c3e; }
    select, input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 15px; }
    
    .termo { font-size: 12px; color: #bbb; text-align: left; display: flex; gap: 8px; align-items: flex-start; margin: 10px 0; background: #111; padding: 10px; border-radius: 8px; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; color: #fff; }
    .btn-pix { background: #00b894; }
    .btn-cartao { background: #0984e3; }
    .btn-ficha { background: #e17055; font-size: 18px; box-shadow: 0 4px 15px rgba(225, 112, 85, 0.4); }
    .btn:disabled { background: #444; box-shadow: none; color: #888; }

    #game-container { width: 100%; height: 320px; background: #000; border: 3px solid #f39c12; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    #pix-area { display: none; background: #fff; color: #000; padding: 15px; border-radius: 10px; margin-top: 10px; }
    #pix-area img { width: 200px; height: 200px; }
    textarea { width: 100%; height: 60px; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🕹️ ARCADE FICHAS MOBILE</h1>
    <div class="saldo-box">🪙 <span id="saldo">0</span> FICHAS</div>
  </div>

  <!-- TELA DO FLIPERAMA -->
  <div class="card">
    <select id="seletor-jogo">
      <option value="sf2" data-core="arcade" data-rom="SUA_URL_DA_ROM_SF2.zip">🥊 Street Fighter II (Arcade)</option>
      <option value="kof98" data-core="arcade" data-rom="SUA_URL_DA_ROM_KOF98.zip">🔥 The King of Fighters '98</option>
      <option value="mslug" data-core="arcade" data-rom="SUA_URL_DA_ROM_MSLUG.zip">🪖 Metal Slug</option>
    </select>

    <div id="game-container">
      <div id="game" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;">
        <p style="color:#f1c40f;font-weight:bold;">INSERT COIN TO PLAY</p>
        <p style="font-size:12px;color:#888;">1 Ficha = 1 Crédito no Arcade</p>
      </div>
    </div>

    <button id="btn-inserir" class="btn btn-ficha" onclick="inserirFicha()">🪙 INSERIR FICHA E JOGAR</button>
  </div>

  <!-- LOJA DE FICHAS -->
  <div class="card">
    <h3 style="margin-top:0;color:#f1c40f;">💰 Comprar Fichas</h3>
    
    <select id="pacote">
      <option value="pacote_5">R$ 5,00 → 5 Fichas (6 Fichas no Pix!)</option>
      <option value="pacote_10">R$ 10,00 → 10 Fichas (12 Fichas no Pix!)</option>
      <option value="pacote_25">R$ 25,00 → 25 Fichas (30 Fichas no Pix!)</option>
    </select>

    <input type="text" id="cpf" placeholder="Seu CPF (necessário para Pix e segurança)" maxlength="14">

    <label class="termo">
      <input type="checkbox" id="aceite-termos">
      <span>Concordo que as fichas digitais são de consumo imediato e, após creditadas ou utilizadas nas partidas, <b>não são passíveis de estorno ou reembolso</b>.</span>
    </label>

    <button class="btn btn-pix" onclick="comprar('pix')">⚡ PAGAR COM PIX (+20% FICHAS GRÁTIS)</button>
    <button class="btn btn-cartao" onclick="comprar('checkout_completo')">💳 CARTÃO DE CRÉDITO / DÉBITO / BOLETO</button>

    <!-- ÁREA DO QR CODE PIX -->
    <div id="pix-area">
      <strong>Escaneie ou copie o Pix abaixo:</strong><br>
      <img id="pix-qr" src="" alt="QR Code Pix"><br>
      <textarea id="pix-copia" readonly></textarea>
      <button class="btn btn-pix" onclick="copiarPix()">📋 COPIAR CÓDIGO PIX</button>
    </div>
  </div>

  <script>
    const USER_ID = 'jogador1';

    async function atualizarSaldo() {
      const res = await fetch(`/api/usuario/${USER_ID}`);
      const data = await res.json();
      document.getElementById('saldo').innerText = data.fichas;
    }

    async function comprar(metodo) {
      const pacoteId = document.getElementById('pacote').value;
      const cpf = document.getElementById('cpf').value;
      const aceitouTermos = document.getElementById('aceite-termos').checked;

      if (!aceitouTermos) return alert('Marque a caixa aceitando os termos antes de comprar.');
      if (metodo === 'pix' && cpf.length < 11) return alert('Digite um CPF válido para gerar o Pix.');

      const res = await fetch('/api/comprar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: USER_ID, pacoteId, metodo, aceitouTermos, cpf })
      });

      const data = await res.json();
      if (data.erro) return alert(data.erro);

      if (data.tipo === 'pix') {
        document.getElementById('pix-area').style.display = 'block';
        document.getElementById('pix-qr').src = `data:image/png;base64,${data.qr_code_base64}`;
        document.getElementById('pix-copia').value = data.qr_code;
      } else if (data.tipo === 'link') {
        window.location.href = data.init_point; // Abre checkout do Mercado Pago
      }
    }

    function copiarPix() {
      const campo = document.getElementById('pix-copia');
      campo.select();
      document.execCommand('copy');
      alert('Código Pix copiado! Pague no app do seu banco.');
    }

    async function inserirFicha() {
      const select = document.getElementById('seletor-jogo');
      const opcao = select.options[select.selectedIndex];
      const jogoNome = opcao.text;

      const res = await fetch('/api/inserir-ficha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: USER_ID, jogo: jogoNome })
      });

      const data = await res.json();
      if (data.erro) return alert(data.erro);

      atualizarSaldo();
      iniciarEmulador(opcao.dataset.core, opcao.dataset.rom);
    }

    // Inicia o EmulatorJS com botões virtuais na tela do celular
    function iniciarEmulador(core, romUrl) {
      document.getElementById('game').innerHTML = '';
      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = romUrl;
      window.EJS_pathtodata = 'https://emulatorjs.org';
      window.EJS_startOnLoaded = true;

      const script = document.createElement('script');
      script.src = 'https://emulatorjs.orgloader.js';
      document.body.appendChild(script);
    }

    atualizarSaldo();
  </script>
</body>
</html>
